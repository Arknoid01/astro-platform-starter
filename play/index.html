<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Astro RPG</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a12;
      }
      #game-container {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>

    <!-- Phaser (fichier local, pas CDN) -->
    <script src="lib/phaser.min.js"></script>

    <!-- Données intégrées (pas de fetch) -->
    <script src="js/plans-data.js"></script>

    <!-- Jeu : scripts classiques, pas de modules ES -->
    <script src="js/constants.js"></script>
    <script src="js/grid.js"></script>
    <script src="js/autotiler.js"></script>
    <script src="js/plan-picker.js"></script>
    <script src="js/scenes.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
